services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./webova_aplikace/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./webova_aplikace
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      MOBILE_APP_PIN: ${MOBILE_APP_PIN:?Nastav MOBILE_APP_PIN v .env}
    volumes:
      # Perzistentní úložiště fotek mimo kontejner
      - ./webova_aplikace/static/uploads:/app/static/uploads
      # Fallback obrázky z webové aplikace
      - ./webova_aplikace/no_photo.png:/app/no_photo.png:ro
      - ./webova_aplikace/sirsi_no_photo.png:/app/sirsi_no_photo.png:ro
      - ./webova_aplikace/zavareniny.png:/app/zavareniny.png:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
