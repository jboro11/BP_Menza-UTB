name: menza_foto
description: Mobilní aplikace pro kuchaře – fotografie jídel z menzy UTB.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3 icons
  material_design_icons_flutter: ^7.0.7296

  # State management
  provider: ^6.1.2

  # HTTP calls
  http: ^1.2.1

  # Camera / gallery
  image_picker: ^1.0.7

  # Image manipulation (brightness, contrast)
  image: ^4.1.7

  # File paths
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.jpg"